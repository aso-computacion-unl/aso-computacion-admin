name: CI

# Runs on every pull request and on main. Needs no secrets: pull requests from
# forks get a read-only token and no secrets, and nothing here asks for them.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Lifecycle scripts are skipped above; run the project's own postinstall (prisma generate) from the local install.
      - run: npm run postinstall
      # Production dependencies only; fails on high or critical advisories.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      # Unit tests with the coverage thresholds from vitest.config.ts.
      - run: npm run test:coverage
      - run: npm run build

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Disposable Postgres started by the script with docker-compose.test.yml.
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54329/aso_computacion_admin_test?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Lifecycle scripts are skipped above; run the project's own postinstall (prisma generate) from the local install.
      - run: npm run postinstall
      - run: npm run test:integration

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Test-only values for a throwaway database and a throwaway admin; none of them is a secret.
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54329/aso_computacion_admin_test?schema=public
      ADMIN_PASSWORD: e2e-only-admin-password-0123456789
      ADMIN_SECRET: e2e-only-session-secret-0123456789-abcdefghij
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Lifecycle scripts are skipped above; run the project's own postinstall (prisma generate) from the local install.
      - run: npm run postinstall
      # Chromium only, with the system libraries it needs.
      - run: npx playwright install --with-deps chromium
      # Starts the disposable Postgres, migrates it, builds the app, runs Playwright against `next start`, tears down.
      - run: npm run e2e
