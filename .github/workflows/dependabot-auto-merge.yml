name: Dependabot auto-merge

# Approves and queues auto-merge for Dependabot minor and patch updates only.
# Auto-merge waits for every required status check in the "protect main"
# ruleset, so nothing merges while CI is red or still running. Major updates
# get no approval and wait for a human review. Every commit in the pull request
# must come from Dependabot with a verified signature; a pushed commit from
# anyone else turns auto-merge off. The job runs again on every push.
on:
  pull_request:

permissions:
  contents: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository_owner == 'aso-computacion-unl'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - id: commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          foreign=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits" \
            --jq '.[] | select(.author.login != "dependabot[bot]" or .commit.verification.verified != true) | .sha')
          if [ -n "$foreign" ]; then echo "only-dependabot=false" >> "$GITHUB_OUTPUT"; else echo "only-dependabot=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.commits.outputs.only-dependabot == 'true' && (steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch')
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review --approve --body "Minor or patch update: approved for auto-merge once required checks pass." "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
      - if: steps.commits.outputs.only-dependabot != 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --disable-auto "$PR_URL" || true
