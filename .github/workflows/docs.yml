name: Docs

# Pull request: renders the portal only (fails on render errors).
# Push to main, weekly schedule or manual run: renders and publishes on GitHub Pages.
# The schedule picks up changes to the landing docs, which live in another repository.
# Requires Settings → Pages → Source: GitHub Actions.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Render Quarto
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Lint the OpenAPI spec
        run: npx --yes @redocly/cli@2 lint docs/openapi.yaml
      - uses: quarto-dev/quarto-actions/setup@v2
      # The pre-render hook clones the landing docs (public repository, no token needed).
      - uses: quarto-dev/quarto-actions/render@v2
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    name: Publish on GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
