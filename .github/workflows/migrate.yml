name: Migrate production database

# Applies the committed Prisma migrations to the production database, so nobody has to copy the
# Neon connection string by hand for every migration. See docs/DEPLOY.md, section 1.
#
# - On a push to main that touches prisma/migrations/, it runs on its own.
# - Run it by hand (Actions > Migrate production database > Run workflow) to apply again what is
#   on main, for instance after fixing the secret.
#
# It only ever checks out main: whatever runs with the connection string (the lockfile, the Prisma
# config, the SQL) has been merged, never a pull request branch. So a migration is merged in its
# own pull request first; once this has applied it, the code that needs it is merged.
#
# The connection string lives only in the `production-db` environment, as MIGRATE_DATABASE_URL
# (the DIRECT Neon string, no `-pooler`). That environment accepts runs from main only, so a
# branch cannot swap this file to reach it.
on:
  push:
    branches: [main]
    paths:
      - "prisma/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

# One migration run at a time, and never cancel one halfway.
concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production-db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check the connection string
        env:
          DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::MIGRATE_DATABASE_URL is not set in the production-db environment (docs/DEPLOY.md, section 1)."
            exit 1
          fi
          case "$DATABASE_URL" in
            *-pooler.*)
              echo "::error::MIGRATE_DATABASE_URL is the pooled string. Migrations need the direct one (host without -pooler)."
              exit 1
              ;;
          esac
      # Applies pending migrations and nothing else; with none pending it is a no-op.
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
        run: npx --no-install prisma migrate deploy
