name: Migrate production database

# Applies the committed Prisma migrations to the production database, so nobody has to copy the
# Neon connection string by hand for every migration. See docs/DEPLOY.md, section 1.
#
# - It runs on its own after the CI workflow succeeds on a push to main, and checks out exactly the
#   commit that CI validated. A failed or cancelled CI run applies nothing. It runs after every green
#   push to main, not only those touching prisma/migrations/: `migrate deploy` with nothing pending is
#   a no-op, and a later green run picks up a migration whose own CI run was cancelled by a newer push.
# - Run it by hand (Actions > Migrate production database > Run workflow) to apply again what is
#   on main, for instance after fixing the secret.
#
# It only ever checks out main: whatever runs with the connection string (the lockfile, the Prisma
# config, the SQL) has been merged, never a pull request branch. So a migration is merged in its
# own pull request first; once this has applied it, the code that needs it is merged.
#
# The connection string lives only in the `production-db` environment, as MIGRATE_DATABASE_URL
# (the DIRECT Neon string, no `-pooler`). That environment accepts runs from main only, so a
# branch cannot swap this file to reach it.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One migration run at a time, and never cancel one halfway.
concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    # workflow_run also fires for pull requests whose head branch is called "main" (forks included):
    # only a successful CI run of a push to this repository's main gets through.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production-db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI validated; on a manual run, the tip of main.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check the connection string
        env:
          DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::MIGRATE_DATABASE_URL is not set in the production-db environment (docs/DEPLOY.md, section 1)."
            exit 1
          fi
          case "$DATABASE_URL" in
            *-pooler.*)
              echo "::error::MIGRATE_DATABASE_URL is the pooled string. Migrations need the direct one (host without -pooler)."
              exit 1
              ;;
          esac
      # Applies pending migrations and nothing else; with none pending it is a no-op.
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
        run: npx --no-install prisma migrate deploy
