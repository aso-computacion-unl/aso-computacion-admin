# Local development database (npm run db:dev). Not the disposable test database (docker-compose.test.yml).
# A fixed project name keeps one container and volume for every clone or worktree.
name: aso-admin-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aso_admin_dev
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aso_admin_dev"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - aso-admin-dev-postgres:/var/lib/postgresql/data

volumes:
  aso-admin-dev-postgres:
