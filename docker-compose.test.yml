services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aso_computacion_admin_test
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aso_computacion_admin_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - prisma-test-postgres:/var/lib/postgresql/data

volumes:
  prisma-test-postgres:
